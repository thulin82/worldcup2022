name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js v24.x
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          API_KEY: ${{secrets.API_KEY}}
          API_KEY2: ${{secrets.API_KEY2}}

      - name: Lint
        run: npm run lint

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.json

      - name: Test Report
        uses: dorny/test-reporter@v3
        with:
          name: unit tests (v24.x)
          path: test-results.json
          reporter: mocha-json
